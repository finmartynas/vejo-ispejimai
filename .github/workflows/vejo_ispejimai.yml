name: Vėjo gūsių įspėjimai

on:
  schedule:
    # Laikas UTC. Vilniaus laikas = UTC+2 žiemą, UTC+3 vasarą.
    # Ne pilną valandą, nes tada GitHub labiausiai apkrautas ir paleidimai vėluoja ar dingsta.
    # Du paleidimai atsargai: jei pirmas nepasileis, antras vis tiek spės iki 06:50.
    - cron: "23 2 * * 1-5"     # 04:23 žiemą / 05:23 vasarą, pirmadienis–penktadienis
    - cron: "41 3 * * 1-5"     # 05:41 žiemą / 06:41 vasarą (atsarginis)
  workflow_dispatch:        # leidžia paleisti ranka: Actions → Run workflow

permissions:
  contents: write           # reikia, kad galėtų įrašyti rezultatus į repozitoriją

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Įdiegti bibliotekas
        run: pip install -r requirements.txt

      - name: Sugeneruoti ataskaitą
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
          VEJO_OUTPUT_DIR: output
        run: python vejo_ispejimai.py

      - name: Įrašyti rezultatus į repozitoriją
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          [ -f ne_50m_admin_0_map_units.geojson ] && git add ne_50m_admin_0_map_units.geojson
          git commit -m "Vėjo įspėjimai $(TZ=Europe/Vilnius date +%F)" || echo "Nėra pakeitimų"
          git push

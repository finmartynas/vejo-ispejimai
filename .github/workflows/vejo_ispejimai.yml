name: Vėjo gūsių įspėjimai

on:
  schedule:
    # 03:00 UTC = 05:00 Vilniaus laiku žiemą, 06:00 vasarą.
    # GitHub kartais paleidžia 5–30 min. vėliau, todėl paliekama atsarga iki 06:50.
    - cron: "0 3 * * *"
  workflow_dispatch:        # leidžia paleisti ranka: Actions → Run workflow

permissions:
  contents: write           # reikia, kad galėtų įrašyti rezultatus į repozitoriją

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Įdiegti bibliotekas
        run: pip install -r requirements.txt

      - name: Sugeneruoti ataskaitą
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
          VEJO_OUTPUT_DIR: output
        run: python vejo_ispejimai.py

      - name: Įrašyti rezultatus į repozitoriją
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          [ -f ne_50m_admin_0_map_units.geojson ] && git add ne_50m_admin_0_map_units.geojson
          git commit -m "Vėjo įspėjimai $(TZ=Europe/Vilnius date +%F)" || echo "Nėra pakeitimų"
          git push


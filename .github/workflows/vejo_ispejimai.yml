name: Vėjo gūsių įspėjimai

on:
  schedule:
    # Laikas UTC. Vilniaus laikas = UTC+2 žiemą, UTC+3 vasarą.
    - cron: "23 2 * * 1-5"     # 04:23 žiemą / 05:23 vasarą, pirmadienis–penktadienis
    - cron: "41 3 * * 1-5"     # 05:41 žiemą / 06:41 vasarą (atsarginis)
  
  workflow_dispatch:         # Leidžia paleisti ranka: Actions → Run workflow

permissions:
  contents: write            # Būtina, kad galėtų įrašyti rezultatus į repozitoriją

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Įdiegti bibliotekas
        run: pip install -r requirements.txt

      - name: Sugeneruoti ataskaitą
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
          VEJO_OUTPUT_DIR: output
        run: python vejo_ispejimai.py

      - name: Įrašyti rezultatus į repozitoriją
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add output/
          [ -f ne_50m_admin_0_map_units.geojson ] && git add ne_50m_admin_0_map_units.geojson
          
          # Patikriname, ar yra pokyčių, kuriuos reikia commit'inti
          git diff --staged --quiet || git commit -m "Vėjo įspėjimai $(TZ=Europe/Vilnius date +%F)"
          
          # Nusiunčiame tik tada, jei yra pokyčių (arba tiesiog push'iname, jei viskas tvarkoje)
          git push
